version: 2

updates:
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      development-updates:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
      development-security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
