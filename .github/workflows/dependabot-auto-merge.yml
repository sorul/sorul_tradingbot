name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  enable-auto-merge:
    if: >-
      vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      - name: Require development-only patch or minor updates
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          jq -e '
            type == "array" and length > 0 and
            all(.[];
              .dependencyType == "direct:development" and
              .packageEcosystem == "pip" and
              .directory == "/" and
              (.updateType == "version-update:semver-patch" or
               .updateType == "version-update:semver-minor")
            )
          ' <<< "$UPDATED_DEPENDENCIES" >/dev/null

      - name: Require development requirements file only
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json files \
            --jq '.files | length > 0 and all(.[]; .path == "requirements_dev.txt")' \
            | grep -qx true

      - name: Request auto-merge for the observed head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --merge
          --match-head-commit "$HEAD_SHA"
